version: '3.8'

services:
  backend:
    build: .
    ports:
      - "8000:8000"
      - "11434:11434"
    environment:
      - OLLAMA_BASE_URL=http://localhost:11434
      - DATABASE_URL=sqlite:///./stratplan.db
      - DEBUG=true
    volumes:
      - ./exports:/app/exports
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s